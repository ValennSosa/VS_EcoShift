<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 620" fill="none" role="img" aria-labelledby="city-title city-desc">
  <title id="city-title">Ciudad ficticia de VS EcoShift</title>
  <desc id="city-desc">Seis zonas urbanas: residencial, comercial, industrial, espacios verdes, transporte y energía.</desc>
  <style>
    /* En la imagen estática se ocultan los detalles altos para no saturar. */
    [data-show="high"] { display: none; }
  </style>

  <rect width="920" height="620" rx="28" fill="#10382f"/>
  <circle cx="780" cy="88" r="38" fill="#c6ef4a" fill-opacity="0.88"/>
  <circle cx="780" cy="88" r="58" stroke="#c6ef4a" stroke-opacity="0.28"/>
  <path d="M0 470c110-42 190-10 280 4 95 14 150-40 250-22 78 14 150 10 390-40v208H0V470z" fill="#0c342b"/>
  <path d="M40 500c180-20 260 10 420 8 140-2 220-24 420-8" stroke="#145a45" stroke-width="18" stroke-linecap="round" opacity="0.55"/>

