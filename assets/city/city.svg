    <rect x="300" y="232" width="42" height="14" fill="#0c342b"/>
    <rect x="292" y="276" width="14" height="12" fill="#d7eccf"/>
    <rect x="316" y="276" width="14" height="12" fill="#d7eccf"/>
    <rect x="292" y="308" width="14" height="12" fill="#d7eccf"/>
    <rect x="316" y="308" width="14" height="12" fill="#d7eccf"/>
    <rect x="292" y="340" width="14" height="12" fill="#d7eccf"/>
    <rect x="316" y="340" width="14" height="12" fill="#d7eccf"/>
    <rect x="360" y="292" width="48" height="148" rx="6" fill="#1a5c4b"/>
    <rect x="370" y="308" width="12" height="10" fill="#e7f6df"/>
    <rect x="388" y="308" width="12" height="10" fill="#e7f6df"/>
    <rect x="370" y="332" width="12" height="10" fill="#e7f6df"/>
