    <g data-feature="vegetation" data-show="low">
      <circle cx="88" cy="430" r="24" fill="#1c8a62"/>
      <circle cx="128" cy="412" r="30" fill="#187a56"/>
      <rect x="124" y="438" width="6" height="30" rx="3" fill="#d7eccf"/>
    </g>
    <g data-feature="vegetation" data-show="medium">
      <circle cx="176" cy="420" r="26" fill="#23966a"/>
      <circle cx="214" cy="440" r="20" fill="#1c8a62"/>
      <rect x="172" y="442" width="6" height="28" rx="3" fill="#d7eccf"/>
      <ellipse cx="150" cy="488" rx="70" ry="16" fill="#1f9b6f" fill-opacity="0.55"/>
    </g>
    <g data-feature="vegetation" data-show="high">
