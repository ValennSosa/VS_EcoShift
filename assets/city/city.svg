    <path d="M472 172h108l-10 16H482l-10-16z" fill="#0c342b"/>
    <rect x="476" y="214" width="24" height="16" fill="#e7f6df"/>
    <rect x="512" y="214" width="24" height="16" fill="#e7f6df"/>
    <rect x="548" y="214" width="24" height="16" fill="#e7f6df"/>
    <rect x="476" y="250" width="24" height="16" fill="#e7f6df"/>
    <rect x="512" y="250" width="24" height="16" fill="#e7f6df"/>
    <rect x="548" y="250" width="24" height="16" fill="#e7f6df"/>
