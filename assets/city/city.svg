      <circle cx="284" cy="536" r="10" fill="none" stroke="#f8fbf6" stroke-width="3"/>
      <path d="M260 534h16l8-14h12" stroke="#f8fbf6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
